<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up / Login Form</title>
  <link rel="stylesheet" href="styleg.css" />
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <main>
    <input type="checkbox" aria-hidden="false" id="chk" checked>
    <div class="signup">
      <form action="" class="signupForm">
        <label for="chk">Sign up</label>
        <input type="text" required placeholder="User name">
        <input type="email" required placeholder="Email">
        <input type="tel" required placeholder="Phone No.">
        <input type="password" required placeholder="Password">
        <button>Sign up</button>
        <label for="chk" class="switch-button">Login</label>
      </form>
    </div>

    <div class="login">
      <form action="">
        <label for="chk">Login</label>
        <input type="email" required placeholder="Email">
        <input type="password" required placeholder="Password">
        <button>Login</button>
        <label for="chk" class="switch-label">Sign up</label>
      </form>
    </div>
  </main>
</body>

</html>
